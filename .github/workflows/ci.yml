# Builds and tests the engine on every pull request and push to main: on macOS with the Mac app, on Linux in the
# Ubuntu 22.04 container the packages are built in, and on Windows, plus the shell's Rust tests on Linux and on Windows
# (the packages workflow builds, installs and launches the whole Windows app). The model files aren't fetched, so the reference-vector
# test skips itself; everything else runs. Also by hand: `gh workflow run ci.yml`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/llama
          key: llama-macos-${{ hashFiles('scripts/build-llama.sh') }}
      - name: llama.cpp
        run: scripts/build-llama.sh
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test

  linux:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl git gnupg \
            xz-utils unzip python3 binutils build-essential cmake ninja-build meson nasm pkg-config file \
            zlib1g-dev libcurl4-openssl-dev libxml2-dev libedit2 libsqlite3-0 libz3-dev libpython3-dev tzdata
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift
        run: |
          version=6.4.0
          url=https://download.swift.org/swift-$version-release/ubuntu2204/swift-$version-RELEASE/swift-$version-RELEASE-ubuntu22.04.tar.gz
          curl -fsSL -o swift.tar.gz "$url"
          curl -fsSL -o swift.tar.gz.sig "$url.sig"
          curl -fsSL --compressed https://www.swift.org/keys/all-keys.asc | gpg --quiet --import
          gpg --verify swift.tar.gz.sig swift.tar.gz
          mkdir -p "$RUNNER_TEMP/swift"
          tar -xzf swift.tar.gz -C "$RUNNER_TEMP/swift" --strip-components 1
          rm swift.tar.gz swift.tar.gz.sig
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-linux-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/llama
          key: llama-linux-cpu-${{ hashFiles('scripts/build-llama.sh') }}
      - name: Vendored libraries, ffmpeg, llama.cpp
        # The small ffmpeg the packages carry (the image and video tests read HEIC, WebP and MPEG-TS through it);
        # built once per version of its script, then cached. llama.cpp with the CPU backend only.
        run: |
          scripts/fetch-vendor.sh
          scripts/build-ffmpeg.sh
          scripts/build-llama.sh
      - name: Build
        run: swift build -c release
      - name: Test
        run: |
          export PATH="$PWD/Vendor/ffmpeg/bin:$PATH"
          swift test

  windows:
    # As the Windows installer is built (packages.yml), with llama.cpp's CPU backends only.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            make mingw-w64-x86_64-gcc mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-ffmpeg.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/llama
          key: llama-windows-cpu-${{ hashFiles('scripts/build-llama.sh', 'scripts/llama.cpp-no-logits.patch') }}
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: OCR for English
        # Windows.Media.Ocr reads only the languages whose OCR pack is installed; a server image may have none, and then
        # the OCR tests skip themselves.
        continue-on-error: true
        shell: pwsh
        run: |
          $capability = Get-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0"
          "OCR for English: $($capability.State)"
          if ($capability.State -ne "Installed") { Add-WindowsCapability -Online -Name $capability.Name | Out-Null }
      - name: Vendored libraries, llama.cpp
        shell: bash
        run: |
          export PATH="$(dirname "$(command -v cl)"):$PATH"   # MSVC's link.exe before Git's /usr/bin/link
          scripts/fetch-vendor.sh
          scripts/build-llama.sh
      - name: Build
        shell: bash
        run: |
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          swift build -c release
      - name: Test
        # The DLLs on PATH (no rpath on Windows), and ggml's backends where the engine looks for them first.
        shell: bash
        run: |
          export PATH="$(dirname "$(command -v cl)"):$PWD/Vendor/llama/lib:$PWD/Vendor/pdfium/bin:$PWD/Vendor/ffmpeg/bin:$PATH"
          export DIGUP_BACKENDS="$(cygpath -w "$PWD/Vendor/llama/lib")"
          swift test

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/src-tauri/target
          key: cargo-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
      - name: Test
        working-directory: shell/src-tauri
        run: cargo test

  shell-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/src-tauri/target
          key: cargo-windows-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
      - name: Test
        working-directory: shell/src-tauri
        run: cargo test
